# Render Blueprint — deploys the Django backend.
#
# Usage: push to GitHub, create a blueprint in Render, or run the manual
# "New Web Service -> Docker" flow. After creation, set the `sync: false`
# secrets (below) in the dashboard — Render will refuse to start until the
# required environment variables are supplied via your DATABASE_URL.
#
# See README.md for the full deployment runbook.
services:
  - type: web
    name: boutique-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "INFO"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "365"
      - key: USE_X_FORWARDED_FOR
        value: "True"
      # Only the deployed backend host is allowed.
      - key: DJANGO_ALLOWED_HOSTS
        value: "atlier-boutique.onrender.com"
      - key: FRONTEND_ORIGIN
        value: "https://atlier-boutique.vercel.app"
      - key: MPESA_ENV
        value: "sandbox"
      - key: SUPABASE_URL
        value: "https://ngpzjddvkgopfmghjqnv.supabase.co"
      - key: SUPABASE_STORAGE_BUCKET
        value: "product-images"

      # ---- Background work: Celery + Redis (see backend/docs/CELERY.md) ----
      # REDIS_URL is injected automatically by Render once the Redis resource
      # is linked to this service, so it is deliberately not declared here.
      #
      # The free plan cannot run a worker (render.yaml rejects `type: worker`
      # with `plan: free`), so both bulk imports and email delivery run inline
      # inside this web process. Every behaviour — retries, idempotency,
      # audit, the /admin/dashboard/emails pages — is identical; only the
      # process that performs the send differs.
      - key: CELERY_WORKER_ENABLED
        value: "false"

      # Secrets — set each via the Render dashboard ("sync: false" values are
      # never stored in source control):
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false

