<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F7F7F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#181818;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F7F5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E7E5E1;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:20px 28px;border-bottom:1px solid #F0EFEA;">
              <span style="font-size:16px;font-weight:700;letter-spacing:.06em;">{{ store_name|upper }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 16px;font-size:19px;line-height:1.35;font-weight:600;">{{ subject }}</h1>
              <div style="font-size:14px;line-height:1.65;color:#3A3A3A;white-space:pre-wrap;">{{ body_text }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#FAFAF7;border-top:1px solid #F0EFEA;font-size:12px;line-height:1.6;color:#6B6B6B;">
              {% if recipient_name %}<div>Hello {{ recipient_name }},</div>{% endif %}
              <div>{{ store_name }} &middot; {{ store_address }}</div>
              {% if store_phone %}<div>{{ store_phone }}</div>{% endif %}
              <div>{{ store_website }}</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
